[backdrop]
blur_intensity = 0.79999998211860657

[bar.default]
center = [ "cat", "spacer_3", "audio_visualizer", "media" ]
contact_shadow = true
end = [ "tray", "notifications", "clipboard", "volume", "control-center", "session" ]
start = [ "clock", "spacer_2", "workspaces" ]
thickness = 36

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "clipboard"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.79999998211860657
fingerprint = false

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-3", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 1317.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
monitors = [ "HDMI-A-1" ]

[osd.kinds]
lock_keys = false

[plugins]
enabled = [ "noctalia/bongocat" ]

[shell]
app_icon_color = "shadow"
app_icon_colorize = true
avatar_path = "/home/randomasian/pfps/happygoth.jpg"
font_family = "Noto Sans Mono"
lang = "en"
settings_show_advanced = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Ayu"

    [theme.templates]
    builtin_ids = [ "kitty", "niri" ]
    community_ids = [ "spicetify", "zen-browser", "vscode", "discord", "steam" ]

[wallpaper]
directory = "/home/randomasian/wallpapers"
fill_mode = "center"
transition_on_startup = true

[weather]
refresh_minutes = 10

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"
